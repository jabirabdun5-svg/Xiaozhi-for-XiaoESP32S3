name: Build ESP32 Firmware

on:
  push:
    branches: [ "master", "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: 'recursive'

      - name: Set up Environment & Build
        run: |
          sudo apt-get update
          sudo apt-get install -y git wget flex bison gperf python3 python3-pip python3-setuptools cmake ninja-build ccache libffi-dev libssl-dev dfu-util libusb-1.0-0
          
          git clone -b v5.1.2 --recursive https://github.com/espressif/esp-idf.git $HOME/esp-idf
          cd $HOME/esp-idf
          ./install.sh esp32s3
          
          . $HOME/esp-idf/export.sh
          cd $GITHUB_WORKSPACE/Source/xiaozhi-esp32-2.2.2
          idf.py set-target esp32s3
          idf.py build

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: firmware-bin
          path: Source/xiaozhi-esp32-2.2.2/build/*.bin
 
